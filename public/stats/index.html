<html>
	<head>
		<title>Stats</title>

		<base href="/stats/index.html" />

		<script src="../write-html.js" href="/"></script>
	</head>

	<body>
		<style>
			/* Hide the #root we're not using from the imported HTML. */
			#root:first-of-type {
				display: none;
			}

			body {
				overflow: auto;
				pointer-events: auto;
			}

			#loginButtons {
				pointer-events: auto;
				display: block;
				position: absolute;
				top: 10px;
				right: 10px;
				z-index: 1;
			}

			#statsUI {
				padding: 20px;
				overflow-x: auto;
			}
		</style>

		<blaze-component
			id="loginButtons"
			tmpl="loginButtons"
			data='{"align": "right"}'
			onclick="
				if (!event.target?.classList.contains('login-link-text')) return
				// close if open (make the drop down button toggle open/close).
				const close = document.querySelector('.login-close-text')
				if (close) close.click()
			"
		></blaze-component>

		<script type="module" src="./stats.js"></script>
	</body>
</html>
