<html>
	<head>
		<title>Careers</title>

		<script src="./write-html.js" href="/"></script>
	</head>

	<body>
		<style>
			/* Hide the #root we're not using from the imported HTML. */
			#root:first-of-type {
				display: none;
			}

			body {
				overflow: auto;
				pointer-events: auto;
				box-sizing: border-box;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			login-ui {
				pointer-events: auto;
				display: block;
				position: absolute;
				top: 10px;
				right: 10px;
				z-index: 1;
			}
		</style>

		<login-ui
			custom-style="
				#loginButtons a.login-link-text {
					color: black;

					:host-context([data-theme='dark']) & {
						color: white;
					}
				}
			"
		></login-ui>

		<theme-switch></theme-switch>
		<style>
			theme-switch {
				position: absolute;
				top: 30px;
				right: 10px;
				z-index: 1;

				--theme-switch-icon-color: rgb(29, 29, 29);

				[data-theme='dark'] & {
					--theme-switch-icon-color: rgb(219, 219, 219);
				}
			}
		</style>

		<h1>Careers</h1>
		<p>Start prepping your resumes, profiles, or portfolios!</p>

		<script type="module">
			import './routes.js' // track page visits
			import './elements/login-ui.js'
			import './elements/theme-switch.js'

			// Hide the loading cover
			const loadingCover = document.getElementById('loadingCover')
			loadingCover?.classList.add('invisible')
			loadingCover?.addEventListener('transitionend', () => loadingCover.remove())
		</script>
	</body>
</html>
